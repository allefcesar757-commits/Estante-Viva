<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estante Viva</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <h2>Estante Viva</h2>

        <div class="inicio">
            <a href="#catalogo">Catálogo</a>
            <span>|</span>
            <a href="#form-cadastro">Cadastro</a>
        </div>
    </nav>

    <main>
        <h1>Gerenciamento de livros</h1>

        <form id="form-cadastro">
            <h3 id="titulo-form">Cadastrar livro</h3>

            <div class="primeiro-cadastro">
                <div class="campo">
                    <label for="titulo">Título *</label>
                    <input id="titulo" class="titulo-cadastro" type="text" placeholder="Informe o título" required>
                </div>

                <div class="campo">
                    <label for="autor">Autor *</label>
                    <input id="autor" type="text" placeholder="Informe o autor" required>
                </div>
            </div>

            <div class="segundo-cadastro">
                <div class="campo">
                    <label for="preco">Preço (R$) *</label>
                    <input id="preco" type="text" placeholder="0,00" required>
                </div>

                <div class="campo">
                    <label for="estoque">Quantidade em estoque *</label>
                    <input id="estoque" type="number" min="0" placeholder="0" required>
                </div>

                <button type="submit" id="btn-salvar" class="cadastrar-button">Cadastrar livro</button>
            </div>
        </form>

        <h4 id="catalogo">Catálogo de livros</h4>

        <div class="barra-pesquisa">
            <input id="input-busca" class="buscar" type="text" placeholder="Buscar por parte do título">

            <div class="button-pesquisa">
                <button type="button" id="btn-buscar" class="pesquisar">Buscar</button>
                <button type="button" id="btn-limpar" class="limpar">Limpar</button>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Título</th>
                    <th>Autor</th>
                    <th>Preço</th>
                    <th>Estoque</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="lista-livros">
            </tbody>
        </table>

        <br>
    </main>

    <footer>
        <p>Estante Viva — Gerenciamento de catálogo</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
