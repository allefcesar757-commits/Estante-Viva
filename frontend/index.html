<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estande Livro</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <h2>Estante Viva</h2>

        <a href="">Catálogo</a>
        <p>|</p>
        <a href="">Cadastro</a>
    </nav>

    <main>
        <h1>Gerenciamento de livros</h1>

        <form>
            <h5>Cadastrar livro</h5>

            <label>Título *</label>
            <input type="text" placeholder="Informe o título">

            <label>Autor *</label>
            <input type="text" placeholder="Informe o autor">

            <label>Preço (R$) *</label>
            <input type="text" placeholder="0,00">

            <label>Quantidade em estoque *</label>
            <input type="text" placeholder="0">

            <button>Cadastrar livro</button>
        </form>

        <h4>Catálogo de livros</h4>

        <input type="text" placeholder="Buscar por parte do título">

        <button>Buscar</button>
        <button>Limpar</button>

        <table>
            <tr>
                <th>Título</th>
                <th>Autor</th>
                <th>Preço</th>
                <th>Estoque</th>
                <th>Ações</th>
            </tr>

            <tr>
                <td>Título cadastrado</td>
                <td>Nome do autor</td>
                <td>R$ 0,00</td>
                <td>0</td>
                <td><button>Editar</button></td>
                <td><button>Excluir</button></td>
            </tr>

            <tr>
                <td>Título cadastrado</td>
                <td>Nome do autor</td>
                <td>R$ 0,00</td>
                <td>0</td>
                <td><button>Editar</button></td>
                <td><button>Excluir</button></td>
            </tr>
        </table>

        <br>
    </main>

    <footer>Estante Viva - Gerenciamento de catálogo</footer>
</body>
</html>
